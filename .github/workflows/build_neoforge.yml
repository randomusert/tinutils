name: Build and upload tin utils Neoforge JAR


on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
    branches: [ "1.21.1" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: set up permissions
        run: chmod +x ./gradlew
      - name: build neoforge version
        run: ./gradlew :neoforge:build
      - uses: actions/upload-artifact@v7
        with:
          name: Tin-utils-neoforge
          path: |
            neoforge/build/libs/
          retention-days: 180